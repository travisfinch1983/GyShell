# AI-Lab imagegen-models-9310 on CT177 (ai-gpu, px-gpu): memory limits + RAM budget (claude1 2026-10-31).
# Port of the CT176 fix (patch 0004-ram-budget-lru-eviction): on 2026-10-31 04:43Z CT176's 9310 grew to 136 GB
# anon RSS (idle copies ComfyUI offloaded to RAM, never unloaded) and its memcg OOM-killed it. CT177 ran the same
# unbounded code. A drop-in because AI-Lab's ai.js REGENERATES the unit file and
# /opt/proxlab/services/imagegen-models-9310.sh on every relaunch; drop-ins survive that.
#   AILAB_MODELSVC_RAM_BUDGET_GB  serve.py evicts LRU idle RAM-held model copies above this (anon RSS)
#   MemoryHigh                    kernel throttles + reclaims the unit above this (its page cache goes first)
#   MemoryMax                     hard cap: an OOM here kills THIS unit only, not the vLLM services beside it
# Sizing: the CT's 700 GiB memcg is NOT the real limit here. px-gpu has 754 GiB with /mnt/model-cache, a 512 GiB
# RAM disk (318 GiB used 2026-10-31), so the host had ~319 GiB available and the RAM disk can still take ~194 GiB
# of it. CT177 also runs 1cat-vllm-5003/5004/5012 + vllm-5013 + audio-tools-8890 (~32 GiB RSS together). Same
# values as CT176: 100G cap keeps 9310 from eating the host headroom the RAM disk and vLLM need.
[Service]
Environment=AILAB_MODELSVC_RAM_BUDGET_GB=64
Environment=AILAB_MODELSVC_RAM_MIN_IDLE_S=300
# patch 0005 (claude1 2026-10-31, Travis): a copy whose file is on the /model-cache RAM drive is unloaded this many
# seconds after its last use once ComfyUI has pushed it out of VRAM - no second copy of a RAM-drive file in process RAM.
# AILAB_MODELSVC_RAMCACHE_UNLOAD=0 turns that off. Both live-settable: POST /ram {ramcache_idle_s, ramcache_unload}.
Environment=AILAB_MODELSVC_RAMCACHE_IDLE_S=60
MemoryAccounting=yes
MemoryHigh=88G
MemoryMax=100G
