server_url: https://hs.deeveeyant.com
listen_addr: 127.0.0.1:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: true
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    verify_clients: true
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
  # Public Tailscale relays removed 2026-10-22: clients pick their home relay by latency, so with
  # the public map present they used Tailscale's rate-limited relays instead of ours.
  # To restore: put the URL back under urls:.
  urls: []
  paths:
    - /etc/headscale/derp-ca.yaml
  auto_update_enabled: true
  update_frequency: 3h

disable_check_updates: true
# was ephemeral_node_inactivity_timeout (deprecated in 0.29), moved under node.ephemeral:
node:
  ephemeral:
    inactivity_timeout: 30m

database:
  type: sqlite
  debug: false
  gorm:
    prepare_stmt: true
    parameterized_queries: true
    skip_err_record_not_found: true
    slow_threshold: 1000
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
    wal_autocheckpoint: 1000

tls_cert_path: ""
tls_key_path: ""

log:
  level: info
  format: text

policy:
  mode: file
  path: "/etc/headscale/acl.hujson"

dns:
  magic_dns: true
  base_domain: vpn.deeveeyant.com
  override_local_dns: false
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
    # Split-horizon (2026-10-04): tailnet clients resolve *.deeveeyant.com via LAN Technitium, so a
    # LAN-only name never leaks to 1.1.1.1 (Chrome cached the public Cloudflare answer on the LAN).
    # Reached over the 10.0.0.0/24 subnet route when remote.
    split:
      deeveeyant.com:
        - 10.0.0.3
  search_domains: []
  # Public names answered by MagicDNS itself, so they keep resolving even if the subnet route
  # (and therefore 10.0.0.3) is unreachable: control plane + Matrix must never depend on the LAN.
  extra_records:
    - { name: "hs.deeveeyant.com", type: "A", value: "107.173.17.151" }
    - { name: "matrix.deeveeyant.com", type: "A", value: "107.173.17.151" }
    - { name: "deeveeyant.com", type: "A", value: "107.173.17.151" }

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false

# randomize_client_port removed in headscale 0.29 (was: false, the default).
# If ever needed, set "randomizeClientPort": true at the top level of the POLICY, not here.

taildrop:
  enabled: true
