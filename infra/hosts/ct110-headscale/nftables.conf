#!/usr/sbin/nft -f
# CT110 (headscale / tailnet subnet router) input firewall — 2026-10-19, claude1.
# WAN UDP 41641 is port-forwarded here by OPNsense for direct tailnet paths, so default-deny inbound.
# Deliberately NO "flush ruleset": tailscaled owns its own iptables-nft tables (ts-input/ts-forward);
# only this table is replaced, so reloading nftables never strips Tailscale's rules.
table inet hardening
delete table inet hardening
table inet hardening {
	chain input {
		type filter hook input priority filter - 10; policy drop;
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto icmp accept
		meta l4proto ipv6-icmp accept
		iifname "tailscale0" accept                     # tailnet peers (ACL-enforced by headscale)
		udp dport 41641 accept                          # Tailscale WireGuard (the port OPNsense forwards)
		udp dport 68 accept                             # DHCP client
		ip saddr 10.0.0.0/24 tcp dport 22 accept        # SSH from the homelab LAN only
		ip saddr 10.0.0.219 tcp dport 9876 accept       # Cheat Engine MCP forward (CT152 only; socat also enforces)
		counter
	}
	# forward/output untouched (policy accept): subnet routing must keep working.
}

# 2026-10-30 claude1: home LAN -> trailer LAN (10.50.0.0/24) over the tailnet.
# The headscale ACL only admits tailnet-node sources (homelab@), so a home host (10.0.0.x) reaching the
# trailer must leave this subnet router as 100.64.0.3. The trailer OPNsense does the same in the other
# direction. Home OPNsense static route: 10.50.0.0/24 -> 10.0.0.67 (gateway TAILNET_CT110).
table ip lan2tailnet
delete table ip lan2tailnet
table ip lan2tailnet {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		oifname "tailscale0" ip saddr 10.0.0.0/24 ip daddr 10.50.0.0/24 masquerade
	}
}
