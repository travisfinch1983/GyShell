# nicky-dev base services (set up by claude1, 2026-10-12). Secrets: /opt/stack/.env (root only).
# Everything binds to the LAN address of this container only; nothing is published to the internet.
#   Postgres 17 + pgvector  :5432   databases: authentik, app
#   Redis 7                 :6379   (app queues / cache; password in .env)
#   Qdrant                  :6333 (REST) :6334 (gRPC)   api key in .env
#   Authentik               :9000 (http) :9443 (https)   admin UI: http://<ip>:9000/if/flow/initial-setup/
#   Caddy                   :80     web server / reverse proxy, config ./caddy/Caddyfile, site root ./caddy/site
name: stack
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD}
      PG_AUTHENTIK_PASSWORD: ${PG_AUTHENTIK_PASSWORD}   # read by postgres-init on first start
      PG_APP_PASSWORD: ${PG_APP_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: ["./data/redis:/data"]
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes: ["./data/qdrant:/qdrant/storage"]
    ports: ["6333:6333", "6334:6334"]
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.3
    restart: unless-stopped
    command: server
    environment: &ak
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_AUTHENTIK_PASSWORD}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes: ["./data/authentik/media:/media", "./data/authentik/templates:/templates"]
    ports: ["9000:9000", "9443:9443"]
    depends_on:
      postgres: { condition: service_healthy }
  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.3
    restart: unless-stopped
    command: worker
    user: root
    environment: *ak
    volumes: ["./data/authentik/media:/media", "./data/authentik/certs:/certs", "./data/authentik/templates:/templates"]
    depends_on:
      postgres: { condition: service_healthy }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/site:/srv:ro
      - ./data/caddy:/data
    ports: ["80:80"]
