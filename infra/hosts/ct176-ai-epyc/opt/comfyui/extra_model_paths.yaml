        t2i-adapter
    diffusion_models: diffusion-models
    text_encoders: text-encoders
    unet: diffusion-models
    embeddings: embeddings
    upscale_models: upscale-models
    diffusers: diffusers
    gligen: gligen
    style_models: style-models
    photomaker: photomaker
    configs: configs
    audio_encoders: audio-encoders
    ipadapter: ipadapter
    LLM: llm
    TTS: tts
    step_audio: step-audio
    clip_models: clip-models

# Detector library on the shared NAS (/imagegen). Registered here rather than
# symlinked into /opt/comfyui/models/ so it survives container rebuilds.
# Safe because load_extra_path_config accepts arbitrary keys, and
# add_model_folder_path APPENDS -- Impact Pack's own /opt paths still work.
impact-detectors:
    base_path: /imagegen
    ultralytics_bbox: ultralytics/bbox
    ultralytics_segm: ultralytics/segm
    ultralytics: ultralytics
    sams: sam
