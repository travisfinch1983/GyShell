# AI-Lab imagegen-models-9310 on CT176 (ai-epyc): memory limits + RAM budget (claude1 2026-10-31,
# maintenance-claude work order j-mvvx4d47-6ba4). A drop-in because AI-Lab's ai.js REGENERATES the unit
# file and /opt/proxlab/services/imagegen-models-9310.sh on every relaunch; drop-ins survive that.
# 2026-10-31 04:43Z this service grew to 136 GB anon RSS (idle copies offloaded to RAM, never unloaded)
# and the CT's 160 GiB memcg OOM-killed it; llama / comfyui / rvc were restarted after it.
#   AILAB_MODELSVC_RAM_BUDGET_GB  serve.py evicts LRU idle RAM-held model copies above this (anon RSS)
#   MemoryHigh                    kernel throttles + reclaims (swaps) the unit above this
#   MemoryMax                     hard cap: an OOM here kills THIS unit only, not the other CT176 services
# Leaves >= 60 GiB of the CT's 160 GiB for llama / TTS / whisper / comfyui x3 / rvc.
[Service]
Environment=AILAB_MODELSVC_RAM_BUDGET_GB=64
Environment=AILAB_MODELSVC_RAM_MIN_IDLE_S=300
# patch 0005 (claude1 2026-10-31, Travis): a copy whose file is on the /model-cache RAM drive is unloaded this many
# seconds after its last use once ComfyUI has pushed it out of VRAM - no second copy of a RAM-drive file in process RAM.
# AILAB_MODELSVC_RAMCACHE_UNLOAD=0 turns that off. Both live-settable: POST /ram {ramcache_idle_s, ramcache_unload}.
Environment=AILAB_MODELSVC_RAMCACHE_IDLE_S=60
MemoryAccounting=yes
MemoryHigh=88G
MemoryMax=100G
