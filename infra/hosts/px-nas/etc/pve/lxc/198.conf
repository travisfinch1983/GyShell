#AI-Lab agent container for px-nas (RTX 5060, shared with Frigate). Built by claude1 2026-10-28; roadmap proj-mvsfbjthb9t.
arch: amd64
cores: 8
features: nesting=1,keyctl=1
hookscript: px-data:snippets/proxlab-master.sh
hostname: ai-nas
memory: 16384
net0: name=eth0,bridge=vmbr0,hwaddr=BC:24:11:0D:AE:86,ip=dhcp,type=veth
onboot: 1
ostype: debian
rootfs: local-zfs:subvol-198-disk-0,size=80G
swap: 2048
tags: 10.0.0.48;agent;ai;rtx5060
unprivileged: 1
lxc.mount.entry: /mnt/flashpool/ai-assets/llm models none rbind,ro,create=dir 0 0
# proxlab-gpu-start ... proxlab-gpu-end : written by the AI-Lab hookscript (agent sync), not by hand
