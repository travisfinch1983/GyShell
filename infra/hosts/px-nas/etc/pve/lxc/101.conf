arch: amd64
cores: 4
features: fuse=1,mknod=1,mount=nfs;cifs,nesting=1
hostname: plex
memory: 7168
nameserver: 10.0.0.3
net0: name=eth0,bridge=vmbr0,hwaddr=e2:63:30:e8:81:e4,ip=dhcp,ip6=auto,type=veth
onboot: 1
ostype: ubuntu
protection: 0
rootfs: local-zfs:subvol-101-disk-0,size=100G
startup: order=0,up=0,down=0
swap: 768
tags: 10.0.0.4;community-script;media
tty: 2
lxc.mount.entry: /mnt/zpoolalpha/media media none rbind,create=dir,optional 0 0
lxc.mount.entry: tmpfs dev/dri tmpfs rw,nosuid,nodev,mode=755,create=dir 0 0
lxc.cgroup2.devices.allow: c 226:* rwm
lxc.mount.entry: /dev/dri/renderD128 dev/dri/renderD128 none bind,create=file 0 0
lxc.mount.entry: /dev/dri/card2 dev/dri/card2 none bind,optional,create=file 0 0
