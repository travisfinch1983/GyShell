# Wyoming <-> OpenAI bridge: lets Home Assistant's core Wyoming integration use
# AI-Lab speech (faster-whisper STT + chatterbox TTS) via the universal proxy.
# Built 2026-11-12 for the fifth-wheel HA (10.50.0.144) + rooted Echo Dot satellites.
# Interim: planned replacement = local whisper+piper on the Arduino Ventuno Q (fifth wheel).
# Runbook: README.md beside this file.
#
# Nothing here pins backend capacity: the AI-Lab proxy load-balances across however many
# chatterbox / whisper instances are up, so no concurrency cap and no instance count live here.
services:
  wyoming-openai:
    image: ghcr.io/roryeckel/wyoming_openai:0.9.0
    container_name: ailab-wyoming-openai
    network_mode: host          # reaches the proxy on 127.0.0.1:17890; serves Wyoming on :10300
    restart: unless-stopped
    environment:
      WYOMING_URI: tcp://0.0.0.0:10300
      WYOMING_LANGUAGES: en
      WYOMING_LOG_LEVEL: INFO
      STT_OPENAI_URL: http://127.0.0.1:17890/api/proxy/stt/v1
      STT_OPENAI_KEY: none
      STT_BACKEND: OPENAI
      STT_MODELS: large-v3-turbo
      TTS_OPENAI_URL: http://127.0.0.1:17890/api/proxy/multi-tts/v1
      TTS_OPENAI_KEY: none
      # KOKORO_FASTAPI = "discover voices via GET <url>/audio/voices" ({"voices":[{"id":..}]}),
      # which AI-Lab multi-tts serves. For the TTS client that is the ONLY thing this backend
      # changes (wyoming_openai v0.9.0 compatibility.py:739). OPENAI would instead advertise
      # OpenAI's HARD-CODED voice names (alloy, echo...). Voices are read at container start:
      # a newly added AI-Lab voice appears in HA after `docker compose restart`.
      # multi-tts takes RAW voice names (preset-tts would silently fall back to Shadowheart).
      TTS_BACKEND: KOKORO_FASTAPI
      TTS_MODELS: chatterbox-turbo
      TTS_STREAMING_MODELS: chatterbox-turbo
