# CT152 local DNS cache (2026-10-17). Technitium (10.0.0.3) rate-limits each
# client to 600 qpm and then blocks ALL of its DNS; with no cache here, one noisy
# process (rule34 add-on connection churn) took AI-Lab's DNS down.
# 127.0.0.1 serves the host; 172.17.0.1 (docker0 gateway) serves the Docker
# containers via /etc/docker/daemon.json "dns" (Docker skips loopback resolvers
# on the default bridge). bind-dynamic: docker0 may appear after dnsmasq starts.
listen-address=127.0.0.1,172.17.0.1
bind-dynamic
no-resolv
server=10.0.0.3
cache-size=10000
