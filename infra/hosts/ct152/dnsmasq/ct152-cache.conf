# CT152 local DNS cache (2026-10-17). Technitium (10.0.0.3) rate-limits each
# client to 600 qpm and then blocks ALL of its DNS; with no cache here, one noisy
# process (rule34 add-on connection churn) took AI-Lab's DNS down. Loopback only:
# Docker skips loopback nameservers, so containers keep using 10.0.0.3 directly.
listen-address=127.0.0.1
bind-interfaces
no-resolv
server=10.0.0.3
cache-size=10000
