#Remote Immich machine-learning server (OpenVINO on Arc A380) for Immich CT123 on px-nas. Built by claude1 2026-10-28; roadmap proj-mvsfbjthb9t.
arch: amd64
cores: 8
dev0: /dev/dri/card2,gid=44
dev1: /dev/dri/renderD128,gid=993
features: nesting=1,keyctl=1
