# AI-Lab colocated memory stack — CT152.
# Volumes live on the NAS (/zpoolgamma/docker-volume/ai-lab) so bulk data stays
# out of the container backup, and the stack can be re-created anywhere that
# mounts the same path. Versions PINNED to what is running today — do not bump
# without checking on-disk format compatibility first.
#
# NOT STARTED YET: migrate each service's data in before `docker compose up`.
# Volume dirs are chmod 0777 on purpose: this is an unprivileged LXC, so a
# container's non-root uid maps to a host uid that owns nothing (verified —
# uid 1000 got EPERM until 0777).

services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: ailab-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"      # REST
      - "6334:6334"      # gRPC
    environment:
      # matches /etc/qdrant/config.yaml on the CT166 original
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
    # 74 collections blow past the default 1024 fd limit:
    # "Error while starting REST server: Too many open files (os error 24)"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - /zpoolgamma/docker-volume/ai-lab/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  weaviate:
    # Pinned to what CT187 was running. Env replicated FAITHFULLY from
    # /etc/default/weaviate — in particular ENABLE_MODULES must stay, because 2 of
    # the 64 classes declare vectorizer=text2vec-openai and will not load without
    # that module present. (Both external endpoints below are DEAD — ollama
    # 10.0.0.163 and the decommissioned ProxLab 10.0.0.233 — but the 62 classes we
    # actually use are vectorizer=none, i.e. we supply vectors explicitly, so this
    # only matters for those 2 legacy classes. Cleaning them up is separate work.)
    image: cr.weaviate.io/semitechnologies/weaviate:1.36.5
    container_name: ailab-weaviate
    restart: unless-stopped
    ports:
      - "8087:8080"      # 8080 on the host is the AI-Lab MCP gateway — do NOT use it
      - "50051:50051"    # gRPC
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      ENABLE_MODULES: "text2vec-ollama,generative-ollama,text2vec-openai,generative-openai"
      DEFAULT_VECTORIZER_MODULE: text2vec-openai
      CLUSTER_HOSTNAME: node1          # stored in the data dir — changing it breaks metadata
      QUERY_DEFAULTS_LIMIT: "25"
      QUERY_MAXIMUM_RESULTS: "100000"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      AUTHENTICATION_APIKEY_ENABLED: "false"
      OLLAMA_API_ENDPOINT: "http://10.0.0.163:11434"
      OPENAI_BASE_URL: "http://10.0.0.233:7777/api/proxy/llm/v1"
      OPENAI_APIKEY: "proxlab-no-auth"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - /zpoolgamma/docker-volume/ai-lab/weaviate:/var/lib/weaviate

  chroma:
    image: chromadb/chroma:1.5.5
    container_name: ailab-chroma
    restart: unless-stopped
    ports:
      - "8010:8000"   # 8000 on the host is chroma
    volumes:
      - /zpoolgamma/docker-volume/ai-lab/chroma:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # chromadb OOM-killed at 2GB during bulk ops and needed 8GB — see memory note.
    deploy:
      resources:
        limits:
          memory: 8G

  openviking:
    # Built from ./openviking — pip install 0.3.22 + our 2 local patches applied
    # and VERIFIED at build time (see that Dockerfile; the patches live only in
    # site-packages upstream, so a bare pip install would erase them silently).
    image: ailab/openviking:0.3.22
    build: ./openviking
    container_name: ailab-openviking
    restart: unless-stopped
    ports:
      - "1933:1933"
    volumes:
      - /zpoolgamma/docker-volume/ai-lab/openviking:/opt/openviking/workspace
      # Config carries root_api_key — kept OUT of the repo, mounted read-only.
      - /opt/ai-lab-secrets/openviking/ov.conf:/root/.openviking/ov.conf:ro

  redis:
    image: redis:7-alpine
    container_name: ailab-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Pure cache (REDIS_CACHE_TTL=300) — nothing to migrate, starts empty.

  postgres:
    image: postgres:16-alpine
    container_name: ailab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hippocampai
      POSTGRES_USER: hippocampai
      POSTGRES_PASSWORD: hippocampai_pass
    volumes:
      - /zpoolgamma/docker-volume/ai-lab/postgres:/var/lib/postgresql/data
    # NOTE: the source DB on CT26 had ZERO tables — hippo never actually used it
    # despite the config and the unit's After=postgresql.service. Kept so hippo
    # can connect if it ever wants to; nothing was migrated because there was
    # nothing to migrate.

  hippocampai:
    image: ailab/hippocampai:ca24195
    build: ./hippocampai
    container_name: ailab-hippocampai
    restart: unless-stopped
    depends_on: [qdrant, redis, postgres]
    ports:
      - "8010:8000"   # 8000 on the host is chroma
    env_file:
      - /opt/ai-lab-secrets/hippocampai/.env
    volumes:
      - /zpoolgamma/docker-volume/ai-lab/hippocampai:/opt/HippocampAI/data
