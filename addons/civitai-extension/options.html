<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CivitAI to AI-Lab: Options</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #14141c; color: #e2e8f0;
      max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 18px; }
    label { display: block; margin: 16px 0 4px; font-size: 13px; font-weight: 600; }
    .help { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; font: 13px monospace; background: rgba(0,0,0,0.4);
      color: #e2e8f0; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; }
    button { margin-top: 18px; padding: 8px 16px; border: 0; border-radius: 6px; background: #8b5cf6; color: #fff; cursor: pointer; }
    #msg { margin-left: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>CivitAI to AI-Lab</h1>
  <label for="apiUrl">AI-Lab API URL</label>
  <div class="help">The backend that takes downloads and review-queue items (port 17890).</div>
  <input id="apiUrl" placeholder="http://10.0.0.219:17890">
  <label for="webUrl">AI-Lab web URL</label>
  <div class="help">The AI-Lab web UI (port 17889). The Review side panel shows its Review screen.</div>
  <input id="webUrl" placeholder="http://10.0.0.219:17889">
  <button id="save">Save</button><span id="msg"></span>
  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
