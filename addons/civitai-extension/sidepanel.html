<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI-Lab Review</title>
  <style>
    :root { --bg: #14141c; --bar: #1d1d28; --fg: #e2e8f0; --muted: #94a3b8; --accent: #8b5cf6; --line: rgba(255,255,255,0.12); }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; }
    body { display: flex; flex-direction: column; }
    #bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--bar);
      border-bottom: 1px solid var(--line); flex: 0 0 auto; }
    #status { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
    #status b { color: var(--fg); font-weight: 600; }
    button { background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
      padding: 4px 8px; font-size: 11px; cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: default; }
    #frame { flex: 1; border: 0; width: 100%; background: var(--bg); }
    #hint { display: none; padding: 16px; color: var(--muted); line-height: 1.5; }
    #toast { position: fixed; left: 8px; right: 8px; bottom: 8px; padding: 8px 10px; border-radius: 8px;
      color: #fff; display: none; font-size: 12px; }
    #toast.ok { background: #059669; } #toast.err { background: #dc2626; }
  </style>
</head>
<body>
  <div id="bar">
    <div id="status">Connecting to AI-Lab...</div>
    <button id="queueBtn" title="Add this model to AI-Lab's review queue for later" disabled>Queue for later</button>
    <button id="reloadBtn" title="Reload the panel">&#x21bb;</button>
    <button id="optionsBtn" title="Extension options">&#x2699;</button>
  </div>
  <div id="hint">Open a CivitAI model page in this tab to review it here.</div>
  <iframe id="frame" allow="clipboard-write"></iframe>
  <div id="toast"></div>
  <script src="settings.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
